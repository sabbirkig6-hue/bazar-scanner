
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazar Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      text-align: center;
      background: #087f5b;
      color: white;
      padding: 22px 12px;
      border-radius: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 12px #00000012;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
    }

    input {
      width: 100%;
      margin-top: 12px;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 12px;
    }

    #message {
      white-space: pre-wrap;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <header>
    <h1>🛒 Bazar Scanner</h1>
    <p>পণ্যের ছবি থেকে বাজারদর জানুন</p>
  </header>

  <div class="card">
    <h2>📸 পণ্যের ছবি নির্বাচন করুন</h2>

    <input
      type="file"
      id="photo"
      accept="image/*"
      capture="environment"
    >

    <img id="preview" alt="নির্বাচিত পণ্যের ছবি">

    <button onclick="showMessage()">
      পণ্য পরীক্ষা করুন
    </button>

    <p id="message">
      প্রথমে একটি পণ্যের ছবি নির্বাচন করুন।
    </p>
  </div>

  <script>
    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");

    photo.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      message.textContent =
        "ছবি নির্বাচন করা হয়েছে। এবার পণ্য পরীক্ষা করুন।";
    });

    function showMessage() {
      if (!photo.files.length) {
        message.textContent =
          "আগে পণ্যের একটি ছবি নির্বাচন করুন।";
        return;
      }

      message.textContent =
        "ছবি প্রস্তুত! AI দিয়ে পণ্য চেনা ও বাজারদর খোঁজার ব্যবস্থা পরের ধাপে যুক্ত করব।";
    }
  </script>
</body>
</html>
